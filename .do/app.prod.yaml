# DigitalOcean App Platform — PRODUCTION (branch: main)
#
# This is a STATIC SITE, not a web service. The build emits plain
# HTML/CSS/JS/images with no server, API or runtime, so a service would
# cost money monthly to run a container doing nothing a CDN can't.
#
#   doctl apps create --spec .do/app.prod.yaml
#   doctl apps update <app-id> --spec .do/app.prod.yaml
name: spibjjteam-prod
region: nyc

static_sites:
  - name: spibjjteam-prod
    github:
      repo: melendezisaiah16/spijiujitsuteam
      branch: main
      deploy_on_push: true

    # `--include=dev` is load-bearing. All the build tooling (Vite,
    # Tailwind, sharp, TypeScript) lives in devDependencies, and
    # buildpacks commonly set NODE_ENV=production, which makes npm skip
    # them — the build then dies with "vite: not found".
    #
    # `--ignore-scripts` means no dependency executes code during
    # install on the build machine, which is the cheapest way to blunt a
    # compromised-package attack. Verified the build still succeeds:
    # sharp ships prebuilt binaries via optionalDependencies rather than
    # a node-gyp install step, so nothing here needs to compile.
    # NOTE: production is currently running WITHOUT --ignore-scripts.
    # The flag is live on dev as a canary; promote it here once dev has
    # built green a few times. Deliberate: a build-time change does not
    # belong in the same deploy as an urgent configuration fix.
    build_command: npm ci --include=dev && npm run build
    output_dir: dist
    environment_slug: node-js

    envs:
      # Floor comes from Vite (^20.19 || >=22.12); see `engines`.
      - key: NODE_VERSION
        scope: BUILD_TIME
        value: "22"

      # Feeds the canonical link, Open Graph tags, JSON-LD and
      # sitemap.xml. Written literally rather than as ${APP_URL} now
      # that a custom domain is live: if that variable expands to the
      # ondigitalocean.app hostname instead of the primary domain, every
      # canonical on the site points at the wrong host and tells Google
      # the real domain is the duplicate. Not worth the ambiguity for
      # one line that changes once a decade.
      - key: SITE_URL
        scope: BUILD_TIME
        value: https://spijiujitsuteam.com

      # SITE_NOINDEX is deliberately absent. It lived here while the
      # site ran on a temporary URL; the domain is live, so production
      # must be indexable. It stays permanently in app.dev.yaml — dev
      # must never be crawlable or it competes with production for the
      # same queries.

      # GA4. Production only, and deliberately absent from app.dev.yaml
      # and from local builds — the property should contain visitors,
      # not us. Not a secret: a measurement ID is visible in the page
      # source of every site that uses one.
      #
      # Do NOT also paste Google's copy-paste snippet into index.html.
      # src/lib/analytics.ts already loads the tag, and a second
      # `config` call doubles every page_view.
      - key: GA_MEASUREMENT_ID
        scope: BUILD_TIME
        value: G-62T44XVCE1

    # No catchall_document on purpose. It rewrites every unknown path
    # to index.html, which suits a client-side router and not this —
    # one page, no routes. A catchall returns 200 for /anything and
    # manufactures soft 404s.

# The live domain. This block is NOT optional decoration: `doctl apps
# update --spec` reconciles domains, so applying a spec without it would
# strip the custom domain off a running site. TLS is automatic.
domains:
  - domain: spijiujitsuteam.com
    type: PRIMARY

  # www has a CNAME at the registrar (GoDaddy) pointing here. It was
  # resolving but refusing connections, because DigitalOcean will not
  # serve — or issue a certificate for — a hostname the app doesn't
  # claim. Listing it here is what fixes that.
  - domain: www.spijiujitsuteam.com
    type: ALIAS
