<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07101F" />

    <!--
      Fonts fetch in parallel with the stylesheet instead of waiting
      for it to parse. Without this the browser paints in the fallback
      first and swaps, which is visible at the hero's 142px display
      size. Stable filenames (not Vite-hashed) are what make it
      possible to name them here; the @font-face rules are in
      src/index.css.
    -->
    <link
      rel="preload"
      href="/fonts/big-shoulders-display-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>SPI Jiu Jitsu — Brazilian Jiu Jitsu in Port Isabel, TX | First Class Free</title>
    <meta
      name="description"
      content="Brazilian jiu jitsu classes for adults, teens, and kids in Port Isabel, Texas. Mon–Thu evenings at 134 S Shore Dr. No experience needed — your first class is free. Text (956) 667-1971."
    />

    <link rel="canonical" href="__SITE_URL__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SPI Jiu Jitsu" />
    <meta property="og:title" content="SPI Jiu Jitsu — Brazilian Jiu Jitsu in Port Isabel, TX" />
    <meta
      property="og:description"
      content="Four nights a week, minutes from the causeway. Your first class is free."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The SPI Jiu Jitsu team together after a competition."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/assets/spi-logo.png" />
    <link rel="apple-touch-icon" href="/assets/spi-logo.png" />

        "url": "__SITE_URL__/",
        "telephone": "+19566671971",
        "image": "__SITE_URL__/assets/og-image.jpg",
        "logo": "__SITE_URL__/assets/spi-logo.png",
        "priceRange": "$$",

          "addressCountry": "US"
        },
